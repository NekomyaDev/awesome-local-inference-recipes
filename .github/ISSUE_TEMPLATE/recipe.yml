name: Recipe submission
description: Add a model × engine × hardware result with its source.
title: "[recipe] <model> on <hardware>"
labels: [recipe]
body:
  - type: markdown
    attributes:
      value: "Only fill what the source shows. Unknown → leave blank (null)."
  - type: markdown
    attributes:
      value: "Focus: add new models and new hardware in the first few weeks after launch. Add non-mainstream combinations too (multi-GPU, multi-machine, AMD and Apple mixes, budget builds). Merge a new result into an existing entry only when the tester, machine, model and engine are all the same: the newest reliable value becomes the main value, and older values and sources go in the notes. A routine repeat by a different tester (a model × engine × hardware combination that is already in the list) stays a separate entry."
  - type: input
    id: source_url
    attributes: { label: Source URL, placeholder: "https://x.com/... or HF model card" }
    validations: { required: true }
  - type: dropdown
    id: category
    attributes: { label: Category, options: [text, image, video/audio] }
    validations: { required: true }
  - type: input
    id: model
    attributes: { label: Model (+ quant), placeholder: "Qwen3.8-27B UD-Q4_K_XL" }
    validations: { required: true }
  - type: input
    id: engine
    attributes: { label: Engine + version, placeholder: "llama.cpp b6800" }
  - type: input
    id: hardware
    attributes: { label: Hardware, placeholder: "RTX 3090 24GB + 64GB DDR5" }
    validations: { required: true }
  - type: input
    id: metric
    attributes: { label: Result, placeholder: "42 tok/s decode @ 8K ctx; or 1024² in 3.1 s" }
    validations: { required: true }
  - type: dropdown
    id: level
    attributes: { label: Source level, description: "An engine or recipe author who tests their own work: measured only with raw benchmark data and reproduction steps, else claimed.", options: [measured, official, claimed] }
    validations: { required: true }
  - type: textarea
    id: command
    attributes: { label: Launch command (optional), render: shell }
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: Numbers are copied from the source, not estimated.
          required: true
