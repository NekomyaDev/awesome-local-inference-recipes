name: linkcheck
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: linkcheck
  cancel-in-progress: false
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract URLs
        # Every URL in data/recipes.json (structured fields and free text), data/prices.json and data/sources.json.
        # X and Reddit go to urls-walled.txt; every other host goes to urls-strict.txt (scripts/linkcheck_urls.py).
        run: python3 scripts/linkcheck_urls.py
      - name: Check links (strict hosts, docs and guides)
        id: strict
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          # Only 2xx passes. A 403 or 429 from a host other than X or Reddit is reported, so a blocked or rate-limited
          # page gets a look by hand instead of passing silently.
          args: --no-progress --max-concurrency 4 --max-retries 3 --timeout 30 --accept 200..=299 urls-strict.txt docs/*.md recipes/*.md
          fail: false
          output: lychee/strict.md
      - name: Check links (X and Reddit)
        id: walled
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          # X and Reddit answer anonymous fetches with 403 or 429, so those codes are not failures here. A deleted X post
          # can still return 200; this run only catches 404s and dead hosts.
          args: --no-progress --max-concurrency 2 --max-retries 3 --timeout 30 --accept 200..=299,403,429 urls-walled.txt
          fail: false
          output: lychee/walled.md
      - name: Fail on lychee error
        # Exit code 2 means broken links. Other nonzero codes mean lychee failed.
        if: (steps.strict.outputs.exit_code != 0 && steps.strict.outputs.exit_code != 2) || (steps.walled.outputs.exit_code != 0 && steps.walled.outputs.exit_code != 2)
        run: |
          echo "::error::lychee failed (strict ${{ steps.strict.outputs.exit_code }}, walled ${{ steps.walled.outputs.exit_code }}). Not all links were checked."
          exit 1
      - name: Merge reports
        id: report
        if: steps.strict.outputs.exit_code == 2 || steps.walled.outputs.exit_code == 2
        run: |
          set -euo pipefail
          : > lychee/out.md
          if [ "${{ steps.strict.outputs.exit_code }}" = "2" ]; then { echo "## Hosts other than X and Reddit (only 2xx passes)"; echo; cat lychee/strict.md; echo; } >> lychee/out.md; fi
          if [ "${{ steps.walled.outputs.exit_code }}" = "2" ]; then { echo "## X and Reddit (403 and 429 accepted)"; echo; cat lychee/walled.md; } >> lychee/out.md; fi
          echo "broken=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the link issue
        if: steps.report.outputs.broken == 'true' && hashFiles('lychee/out.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -s lychee/out.md ]; then
            echo "::error::lychee reported broken links but lychee/out.md is empty."
            exit 1
          fi
          gh label create links --color d73a4a --description "Broken source links" 2>/dev/null || true
          num=$(gh issue list --label links --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file lychee/out.md
            gh issue comment "$num" --body "Link check run ${{ github.run_id }} updated the report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "Broken source links (weekly link check)" --label links --body-file lychee/out.md
          fi
