name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node scripts/validate.mjs
      - run: node scripts/check_dupes.mjs
      - run: python3 scripts/check_near_dupes.py
      - run: python3 scripts/check_urls.py
      - run: python3 -m unittest discover tests
      - name: No TODO/HACK/FIXME/keep-in-sync markers in code
        run: |
          git grep -nIiE 'TODO|HACK|FIXME|keep in sync|临时|temporary|workaround|order matters|first match wins' -- '*.py' '*.mjs' '*.js' '.github/' ':!tests/fixtures' ':!.github/workflows/validate.yml' && exit 1
          test $? -eq 1
      - name: Generated files are up to date
        run: python3 scripts/gen_all.py && git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"
